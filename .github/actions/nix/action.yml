name: Nix
description: >
  Install Nix and restore this job's /nix/store from the GitHub cache, so
  cache.nixos.org is only asked when flake.lock changes. Only main saves:
  every other ref (PRs, tags) reads main's cache.
inputs:
  key:
    description: The job's cache name (one store per job).
    required: true
  max-size:
    description: Collect garbage down to this store size before saving.
    default: 4G
runs:
  using: composite
  steps:
    - uses: nixbuild/nix-quick-install-action@v35
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ inputs.key }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ inputs.key }}-
        save: ${{ github.ref == 'refs/heads/main' }}
        gc-max-store-size-linux: ${{ inputs.max-size }}
        purge: true
        purge-prefixes: nix-${{ inputs.key }}-
        purge-created: 0
        purge-primary-key: never
